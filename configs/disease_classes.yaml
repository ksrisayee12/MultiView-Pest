  - project_label: "late_blight"
    official_plantvillage_label: "Tomato___Late_blight"
    display_name: "Late Blight (Phytophthora infestans)"
    health_status: "DISEASED"

  - project_label: "tomato_yellow_leaf_curl_virus"
    official_plantvillage_label: "Tomato___Tomato_Yellow_Leaf_Curl_Virus"
